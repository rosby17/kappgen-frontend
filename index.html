    <meta name="description" content="Configure le style de ta chaîne une fois. L’Agent KappGen trouve les idées, crée les vidéos et les publie sur YouTube pendant que tu dors." />

    <script>
      (function () {
        var ready = function () { if (document.body) document.body.classList.add('icon-font-ready'); else document.addEventListener('DOMContentLoaded', ready, { once: true }); };
        if (document.fonts && document.fonts.load) {
          Promise.race([document.fonts.load('24px "Material Symbols Outlined"'), new Promise(function (resolve) { setTimeout(resolve, 2500); })]).then(ready);
        } else { setTimeout(ready, 100); }
      }());
    </script>

        <div style="max-width:640px;margin:80px auto;padding:0 24px;font-family:system-ui,sans-serif;color:#e5e2e1;background:#070b12;">
          <h1 style="font-size:28px;font-weight:800;margin-bottom:12px;">KappGen</h1>
          <p style="font-size:16px;line-height:1.6;color:#bcc8d1;">
            KappGen est un agent autonome qui transforme un script ou un fichier audio en vidéo complète pour YouTube — voix off, images, sous-titres et montage — puis peut la publier directement sur votre chaîne. Configurez le style de votre chaîne une fois ; l'Agent produit ensuite vos vidéos automatiquement.
